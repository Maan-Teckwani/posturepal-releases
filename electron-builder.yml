appId: io.posturepal.app
productName: PosturePal
copyright: Copyright © 2026 PosturePal

directories:
  output: release
  buildResources: assets/build

files:
  - dist/**/*
  - main.js
  - preload.js
  - src/renderer/index.html
  - src/renderer/alert.html
  - src/renderer/background.html
  - package.json
  - node_modules/**/*

# ── macOS ──
# Unsigned build for now. Users will need to right-click → Open the first time
# they launch the app so Gatekeeper allows it. When an Apple Developer cert is
# available, set identity to the cert name, flip hardenedRuntime back to true,
# and re-enable the Apple secrets in .github/workflows/release.yml.
mac:
  category: public.app-category.healthcare-fitness
  icon: assets/build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  artifactName: PosturePal-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
  extendInfo:
    NSCameraUsageDescription: PosturePal uses your webcam locally to analyze posture. Video never leaves your device.
    NSMicrophoneUsageDescription: PosturePal does not use the microphone.
    LSApplicationCategoryType: public.app-category.healthcare-fitness

dmg:
  title: PosturePal
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ──
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/build/icon.ico
  artifactName: PosturePal-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PosturePal
  installerIcon: assets/build/icon.ico
  uninstallerIcon: assets/build/icon.ico

# ── Linux ──
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# ── Auto-updater (GitHub Releases) ──
publish:
  provider: github
  owner: Maan-Teckwani
  repo: posturepal-releases
  private: false
  releaseType: release
