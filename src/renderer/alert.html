<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --cream: #f5f0e8;
      --accent: #d4f57a;
      --border: 2px solid #0a0a0a;
      --shadow-sm: 3px 3px 0px #0a0a0a;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      border: 4px solid red;
      box-sizing: border-box;
      position: relative;
      font-family: 'Space Grotesk', sans-serif;
      transition: border-color 0.3s;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: -1;
      border-radius: 8px;
    }
    .top-bar {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 4px 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--black);
      z-index: 10;
      border-radius: 4px;
    }
    .bottom-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      cursor: pointer;
      color: var(--black);
      font-weight: bold;
      background: var(--accent);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      z-index: 10;
      border-radius: 4px;
      transition: transform 0.1s ease;
    }
    .close-btn:hover {
      transform: scale(1.1);
    }
    .dot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--black);
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 4px 2px;
      width: 48px;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      border: var(--border);
      margin-bottom: 2px;
      background-color: red;
      transition: background-color 0.3s;
    }
    .score {
      font-weight: bold;
      font-size: 20px;
      font-family: 'Instrument Serif', serif;
    }
    #message {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
  </style>
</head>
<body>
  <div class="close-btn" id="closeBtn">✕</div>
  <div class="top-bar">
    <span id="message">Fix your posture! 🪑</span>
    <span id="score" class="score">0</span>
  </div>
  <div class="bottom-bar">
    <div class="dot-container"><div class="dot" id="dotHeadFwd"></div>Head Fwd</div>
    <div class="dot-container"><div class="dot" id="dotHeadDown"></div>Head Down</div>
    <div class="dot-container"><div class="dot" id="dotTilt"></div>Tilt</div>
    <div class="dot-container"><div class="dot" id="dotShoulders"></div>Shoulders</div>
    <div class="dot-container"><div class="dot" id="dotDistance"></div>Distance</div>
  </div>
  <video id="webcam" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('webcam');

    async function acquire(cameraId) {
      if (cameraId) {
        try {
          return await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: cameraId } },
            audio: false
          });
        } catch (err) {
          if (err && err.name === 'OverconstrainedError') {
            return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }
          throw err;
        }
      }
      return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    async function startStream() {
      try {
        let cameraId = null;
        if (window.api) {
          const s = await window.api.getData('settings');
          if (s && s.cameraId) cameraId = s.cameraId;
        }
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        const stream = await acquire(cameraId);
        video.srcObject = stream;
      } catch (err) {
        console.error(err);
      }
    }

    startStream();
    if (window.api && window.api.onCameraChanged) {
      window.api.onCameraChanged(() => startStream());
    }

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.api.dismissAlert();
    });

    window.api.onAlertData((data) => {
      const { score, signals } = data;
      const isGood = signals.headForward.ok && 
                     signals.headDown.ok && 
                     signals.headTilt.ok && 
                     signals.shoulders.ok && 
                     signals.distance.ok;
      
      document.body.style.borderColor = isGood ? 'var(--accent)' : 'red';
      
      const scoreEl = document.getElementById('score');
      scoreEl.innerText = score;
      scoreEl.style.color = isGood ? 'var(--accent)' : 'red';

      const dotHeadFwd = document.getElementById('dotHeadFwd');
      const dotHeadDown = document.getElementById('dotHeadDown');
      const dotTilt = document.getElementById('dotTilt');
      const dotShoulders = document.getElementById('dotShoulders');
      const dotDistance = document.getElementById('dotDistance');

      dotHeadFwd.style.backgroundColor = signals.headForward.ok ? 'var(--accent)' : 'red';
      dotHeadDown.style.backgroundColor = signals.headDown.ok ? 'var(--accent)' : 'red';
      dotTilt.style.backgroundColor = signals.headTilt.ok ? 'var(--accent)' : 'red';
      dotShoulders.style.backgroundColor = signals.shoulders.ok ? 'var(--accent)' : 'red';
      dotDistance.style.backgroundColor = signals.distance.ok ? 'var(--accent)' : 'red';

      let message = "Fix your posture! 🪑";
      if (isGood) {
        message = "Good posture! 🌟";
      } else {
        const bad = [];
        if (!signals.headDown.ok)    bad.push({ key: 'headDown',    delta: signals.headDown.delta,    msg: 'Lift your chin up 👆' });
        if (!signals.distance.ok)    bad.push({ key: 'distance',    delta: 0.5,                       msg: signals.distance.tooClose ? 'Move away from the screen 🖥️' : 'Move closer to the screen' });
        if (!signals.headForward.ok) bad.push({ key: 'headForward', delta: signals.headForward.delta, msg: 'Pull your head back 🐢' });
        if (!signals.shoulders.ok)   bad.push({ key: 'shoulders',   delta: signals.shoulders.delta,   msg: 'Relax your shoulders 💪' });
        if (!signals.headTilt.ok)    bad.push({ key: 'headTilt',    delta: signals.headTilt.delta,    msg: 'Level your head ↔️' });
        
        if (bad.length > 0) {
          bad.sort((a, b) => b.delta - a.delta);
          message = bad[0].msg;
        }
      }
      document.getElementById('message').innerText = message;
    });
  </script>
</body>
</html>
