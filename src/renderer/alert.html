<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alert</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      border: 4px solid #f44336;
      box-sizing: border-box;
      border-radius: 12px;
      position: relative;
      font-family: sans-serif;
      transition: border-color 0.3s;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: -1;
      border-radius: 8px;
    }
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: white;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }
    .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      z-index: 10;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .dot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #b0b0b0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-bottom: 4px;
      background-color: #f44336;
      transition: background-color 0.3s;
    }
    .score {
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="close-btn" id="closeBtn">✕</div>
  <div class="top-bar">
    <span id="message" style="font-size: 14px; font-weight: bold; max-width: 70%; margin-right: 20px;">Fix your posture! 🪑</span>
    <span id="score" class="score">0</span>
  </div>
  <div class="bottom-bar">
    <div class="dot-container"><div class="dot" id="dotHead"></div>Head</div>
    <div class="dot-container"><div class="dot" id="dotShoulders"></div>Shoulders</div>
    <div class="dot-container"><div class="dot" id="dotDistance"></div>Distance</div>
  </div>
  <video id="webcam" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error(err));

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.api.hideAlert();
    });

    window.api.onAlertData((data) => {
      const { score, signals } = data;
      const isGood = score >= 60;
      
      document.body.style.borderColor = isGood ? '#4caf50' : '#f44336';
      
      const scoreEl = document.getElementById('score');
      scoreEl.innerText = score;
      scoreEl.style.color = isGood ? '#4caf50' : '#f44336';

      const dotHead = document.getElementById('dotHead');
      const dotShoulders = document.getElementById('dotShoulders');
      const dotDistance = document.getElementById('dotDistance');

      dotHead.style.backgroundColor = signals.head.ok ? '#4caf50' : '#f44336';
      dotShoulders.style.backgroundColor = signals.shoulders.ok ? '#4caf50' : '#f44336';
      dotDistance.style.backgroundColor = signals.distance.ok ? '#4caf50' : '#f44336';

      let message = "Fix your posture! 🪑";
      if (score >= 60) {
        message = "Good posture! 🌟";
      } else {
        const badSignals = [];
        if (!signals.head.ok) badSignals.push({ type: 'head', severity: signals.head.delta / 0.08 });
        if (!signals.shoulders.ok) badSignals.push({ type: 'shoulders', severity: signals.shoulders.delta / 0.08 });
        if (!signals.distance.ok) {
          const severity = signals.distance.tooClose ? signals.distance.delta / 0.10 : Math.abs(signals.distance.delta) / 0.15;
          badSignals.push({ type: 'distance', severity, tooClose: signals.distance.tooClose, tooFar: signals.distance.tooFar });
        }
        if (badSignals.length > 0) {
          badSignals.sort((a, b) => b.severity - a.severity);
          const worst = badSignals[0];
          if (worst.type === 'head') message = "Lift your head up 👆";
          else if (worst.type === 'shoulders') message = "Relax your shoulders 💪";
          else if (worst.type === 'distance') {
            if (worst.tooClose) message = "Move back from the screen 🖥️";
            else if (worst.tooFar) message = "Move closer to the screen";
          }
        }
      }
      document.getElementById('message').innerText = message;
    });
  </script>
</body>
</html>
